name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11, which package.json's engines require.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run build

  deploy:
    name: Deploy to app.space
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Never cancel a release halfway through.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEEPSPACE_EMAIL: ${{ secrets.DEEPSPACE_EMAIL }}
      DEEPSPACE_PASSWORD: ${{ secrets.DEEPSPACE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx deepspace auth login --json
      - run: npx deepspace deploy --json
